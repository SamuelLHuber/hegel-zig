name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a commit SHA; Zig, libhegel and the devenv
# toolchain are pinned by version and checksum (see "Dependencies" in README).
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Zig 0.17.0 (sha256-verified)
        run: .github/scripts/install-zig.sh
      - run: zig fmt --check .
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'Debug'
      - name: Tests
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Ported libhegel examples
        run: zig build examples -Doptimize=${{ matrix.optimize }} --summary all

  devenv:
    name: devenv / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: devenv test (devenv from the nixpkgs revision and narHash in devenv.lock)
        run: |
          nixpkgs=$(jq -r '.nodes.nixpkgs.locked | "github:NixOS/nixpkgs/\(.rev)?narHash=\(.narHash | @uri)"' devenv.lock)
          nix run "$nixpkgs#devenv" -- test
