name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Zig 0.17.0 (sha256-verified)
        run: .github/scripts/install-zig.sh
      - name: Publish the GitHub release
        run: .github/scripts/release.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
